[package]
name = "easy_callback_derive"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Internal implementation crate for easy_callback"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/easy_callback_derive"
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
proc-macro = true
doctest = false

[dependencies]
paste = { workspace = true, optional = true }
syn = { workspace = true, optional = true }
quote = { workspace = true, optional = true }
proc-macro2 = { workspace = true, optional = true }
proc-macro-crate = { workspace = true, optional = true }

[features]
_any_feature = [
    "dep:paste",
    "dep:syn",
    "dep:quote",
    "dep:proc-macro2",
    "dep:proc-macro-crate",
]
rkyv = ["_any_feature"]
wincode = ["_any_feature"]
postcard = ["_any_feature"]
bitcode = ["_any_feature"]
rmp = ["_any_feature"]
ciborium = ["_any_feature"]
